server:
  port: 8080

spring:
  application:
    name: mall

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:root}
    password:  ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s

  cache:
    type: redis
    cache-names:
      - portalCategoryTree

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ${JWT_SECRET}
  expiration: 7200

order:
  timeout-minutes: 30
  timeout-scan-delay: 60000
  timeout-batch-size: 100

logging:
  level:
    com.mall: debug
